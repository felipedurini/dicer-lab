name: web-and-science-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache-dependency-path: vendor/dsrnamax/go.sum
      - name: Test vendored dsRNAmax and its protocol
        working-directory: vendor/dsrnamax
        run: go test ./...
      - name: Install scientific and locked API dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --require-hashes -r services/simulator_api/requirements.lock
      - name: Build API Docker image with locked Linux dependencies
        run: docker build --pull --file services/simulator_api/Dockerfile --tag dicer-simulator-api:ci .
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Test scientific engine and API
        run: python -B -m unittest discover -s tests -t . -v
      - name: Verify OpenAPI contract is current
        run: python scripts/web/export_openapi.py --check
      - name: Check web application
        working-directory: apps/web
        run: |
          npm run test -- --run
          npm run typecheck
          npm run lint
          npm run build
      - name: Install browser for local UI E2E
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Exercise local lab in Chromium
        working-directory: apps/web
        run: npm run test:e2e
